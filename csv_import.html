const SCOPES = "https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email";
let accessToken = null, tokenClient;

function log(id, msg, cls) {
  const e = document.getElementById(id);
  e.textContent = msg;
  e.className = "status" + (cls ? " " + cls : "");
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function initGoogle() {
  log("signinStatus", "Loading Google APIs…");
  try {
    await Promise.all([
      loadScript("https://apis.google.com/js/api.js"),
      loadScript("https://accounts.google.com/gsi/client")
    ]);
    await new Promise(r => gapi.load("client", r));
    await gapi.client.init({
      discoveryDocs: ["https://sheets.googleapis.com/$discovery/rest?version=v4"]
    });
  } catch(e) {
    log("signinStatus", "Failed to load Google APIs: " + e.message, "err");
    return;
  }

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) {
        log("signinStatus", "Sign-in error: " + resp.error, "err");
        return;
      }
      accessToken = resp.access_token;
      gapi.client.setToken({ access_token: accessToken });

      try {
        const me = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
          headers: { Authorization: "Bearer " + accessToken }
        }).then(r => r.json());
        log("signinStatus", "✓ Signed in as " + (me.email || "unknown"), "ok");
      } catch(e) {
        log("signinStatus", "✓ Signed in (could not verify email)", "ok");
      }
      document.getElementById("btnImport").disabled = false;
    }
  });

  const btn = document.getElementById("btnSignin");
  btn.disabled = false;
  btn.textContent = "Sign in with Google";
  btn.onclick = () => tokenClient.requestAccessToken({ prompt: "consent" });
  log("signinStatus", "Ready — click the button above to sign in.");
}

initGoogle();

document.getElementById("btnImport").onclick = async function() {
  this.disabled = true;
  const prog = document.getElementById("importProgress");
  prog.style.display = "";
  try {
    const now = Date.now();
    const values = ROWS.map((r, i) => [
      (now + i).toString(),
      r.date || "",
      r.brand || "",
      r.title || "",
      r.artist || "",
      r.pieces != null ? r.pieces : "",
      "FALSE", "FALSE", ""
    ]);
    log("importStatus", "Appending " + values.length + " rows to Sheet…");
    await gapi.client.sheets.spreadsheets.values.append({
      spreadsheetId: CONFIG.SPREADSHEET_ID,
      range: "Sheet1!A1",
      valueInputOption: "USER_ENTERED",
      insertDataOption: "INSERT_ROWS",
      resource: { values }
    });
    prog.value = values.length;
    log("importStatus", "✓ " + values.length + " puzzles added!", "ok");
  } catch(err) {
    log("importStatus", "Error: " + err.message + "\n" + JSON.stringify(err.result || {}), "err");
    this.disabled = false;
  }
};
