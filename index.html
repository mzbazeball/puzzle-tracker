<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Puzzle Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="puzzle-piece.svg">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#6b8f71">
<style>
  :root{
    --brown:#6b8f71;
    --tan:#e3ece4;
    --cream:#faf9f3;
    --accent:#5a7d60;
    --text:#37463a;
    --border:#d4ddd0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--cream);
    color:var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  header{
    background:var(--brown);
    color:#fff;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:50;
  }
  header h1{margin:0;font-size:1.2rem;font-weight:600;}
  header .back{
    background:none;border:none;color:#fff;font-size:1rem;cursor:pointer;padding:4px 8px;
  }
  main{
    max-width:600px;
    margin:0 auto;
    padding:20px;
    padding-bottom:80px;
  }
  .screen{display:none;}
  .screen.active{display:block;}

  /* Buttons */
  .big-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:24px;
    margin-bottom:16px;
    font-size:1.15rem;
    font-weight:600;
    color:#fff;
    background:var(--brown);
    border:none;
    border-radius:14px;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.12);
  }
  .big-btn:active{opacity:0.85;}
  .big-btn.secondary{background:var(--accent);}

  .option-btn{
    display:block;
    width:100%;
    padding:16px;
    margin-bottom:12px;
    font-size:1rem;
    font-weight:600;
    color:var(--brown);
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    text-align:left;
  }
  .option-btn:active{background:var(--tan);}

  /* Form */
  .field{margin-bottom:16px;}
  label{display:block;font-weight:600;margin-bottom:6px;font-size:0.92rem;}
  input[type=text], input[type=number], input[type=date], select{
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:1rem;
    background:#fff;
    color:var(--text);
  }
  .checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .checkbox-row input{width:20px;height:20px;}
  .checkbox-row label{margin:0;font-weight:500;}

  .photo-input-wrap{
    display:flex;
    gap:10px;
  }
  .photo-input-wrap label.upload-btn{
    flex:1;
    padding:12px;
    border:1px dashed var(--border);
    border-radius:8px;
    text-align:center;
    cursor:pointer;
    font-weight:600;
    color:var(--brown);
    background:#fff;
  }
  #photoPreview{
    margin-top:10px;
    max-width:100%;
    max-height:200px;
    border-radius:8px;
    display:none;
  }

  .submit-btn{
    width:100%;
    padding:16px;
    font-size:1.05rem;
    font-weight:700;
    color:#fff;
    background:var(--accent);
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:8px;
  }
  .submit-btn:disabled{opacity:0.6;}

  /* Toggle */
  .toggle-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .toggle-row button{
    flex:1;
    padding:10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    font-weight:600;
    cursor:pointer;
    color:var(--brown);
  }
  .toggle-row button.active{
    background:var(--brown);
    color:#fff;
    border-color:var(--brown);
  }
  /* Sort row for View All */
  .sort-all-row{
    display:flex;
    gap:6px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .sort-all-row button{
    padding:6px 11px;
    border:1px solid #a8c4e0;
    border-radius:7px;
    background:#fff;
    font-size:0.8rem;
    font-weight:600;
    cursor:pointer;
    color:#3a6e9e;
  }
  .sort-all-row button.active{
    background:#5b9bd5;
    color:#fff;
    border-color:#5b9bd5;
  }

  /* Group headings */
  .group-heading{
    font-weight:700;
    font-size:1rem;
    margin:20px 0 10px;
    color:var(--brown);
    border-bottom:2px solid var(--border);
    padding-bottom:4px;
  }

  /* Grid view */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  .grid-item{cursor:pointer;}
  .grid-item img, .grid-item .noimg{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:10px;
    background:var(--tan);
  }
  .grid-item .noimg{
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--brown);
    font-size:0.85rem;
    text-align:center;
    padding:8px;
  }
  .grid-item .meta{
    font-size:0.8rem;
    margin-top:6px;
    line-height:1.3;
  }
  .grid-item .meta .b{font-weight:700;}

  /* List view */
  .list-item{
    display:flex;
    gap:12px;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .list-item img, .list-item .noimg{
    width:60px;
    height:60px;
    object-fit:cover;
    border-radius:8px;
    flex-shrink:0;
    background:var(--tan);
  }
  .list-item .noimg{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.6rem;
    text-align:center;
    color:var(--brown);
  }
  .list-item .meta{font-size:0.85rem;line-height:1.4;}
  .list-item .meta .b{font-weight:700;}

  /* Modal */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:100;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-overlay.active{display:flex;}
  .modal{
    background:#fff;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:20px;
  }
  .modal img{
    width:100%;
    border-radius:10px;
  }
  .photo-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,0.35);
    color:#fff;
    border:none;
    border-radius:50%;
    width:36px;
    height:36px;
    font-size:22px;
    line-height:1;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    padding:0;
    z-index:2;
  }
  .photo-dot{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ccc;
    margin:0 3px;
    transition:background 0.2s;
  }
  .photo-dot.active{ background:var(--green); }
  .photo-thumb-preview{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
    border:2px solid var(--border);
  }
  .modal-close{
    display:block;
    margin:16px auto 0;
    padding:10px 24px;
    border:none;
    border-radius:8px;
    background:var(--brown);
    color:#fff;
    font-weight:600;
    cursor:pointer;
  }
  .detail-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid var(--border);
    font-size:0.95rem;
  }
  .detail-row .label{font-weight:600;color:var(--brown);}

  .results-count{
    text-align:center;
    font-size:1rem;
    font-family:inherit;
    color:var(--brown);
    font-weight:700;
    margin-bottom:20px;
    padding:8px 14px;
    background:var(--tan);
    border-radius:8px;
  }
  .empty-msg{
    text-align:center;
    color:#9a8b7a;
    padding:40px 20px;
    font-style:italic;
  }
  .status-msg{
    text-align:center;
    padding:14px;
    font-weight:600;
    color:var(--brown);
  }
  .signin-wrap{
    text-align:center;
    padding-top:60px;
  }
  .signin-wrap p{color:#7a6c5d;margin-bottom:20px;}
  #signinBtn{
    display:inline-block;
  }
  .config-warning{
    background:#fff3cd;
    border:1px solid #ffe69c;
    color:#664d03;
    padding:12px;
    border-radius:8px;
    font-size:0.85rem;
    margin-bottom:16px;
  }
</style>
</head>
<body>

<header>
  <button class="back" id="backBtn" style="visibility:hidden;">&larr; Back</button>
  <h1 id="headerTitle" style="cursor:pointer;" title="Go to home">Puzzle Tracker</h1>
  <button class="back" id="signOutBtn" style="visibility:hidden;">Sign out</button>
</header>

<main>

  <!-- SIGN IN (owner only) -->
  <div class="screen" id="screen-signin">
    <div class="signin-wrap">
      <p>Sign in with Google to manage this puzzle tracker (add puzzles, edit, bulk add photos).</p>
      <div id="signinBtn"></div>
      <div id="configWarning"></div>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <button class="big-btn" id="btnTrack" style="display:none;">📋 Track a Puzzle</button>
    <button class="big-btn secondary" id="btnView">🧩 View Tracked Puzzles</button>
    <button class="big-btn secondary" id="btnSearch">🔍 Search Puzzles</button>
    <button class="big-btn" id="btnBulkPhotos" style="background:var(--accent);display:none;">🖼️ Bulk Add Photos</button>
    <button class="option-btn" id="btnOwnerSignIn" style="margin-top:30px;text-align:center;">🔑 Owner sign in</button>
  </div>

  <!-- SEARCH -->
  <div class="screen" id="screen-search">
    <div class="field">
      <input type="text" id="searchInput" placeholder="Search by title, brand, or artist…" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div id="searchResults"></div>
  </div>

  <!-- TRACK FORM -->
  <div class="screen" id="screen-track">
    <form id="trackForm">
      <div class="field">
        <label for="f-date">Date Completed</label>
        <input type="date" id="f-date" required>
      </div>
      <div class="field">
        <label for="f-brand">Puzzle Brand</label>
        <input type="text" id="f-brand" placeholder="e.g. Ravensburger" autocomplete="off" list="brand-list">
        <datalist id="brand-list"></datalist>
      </div>
      <div class="field">
        <label for="f-title">Puzzle Title</label>
        <input type="text" id="f-title" placeholder="e.g. Venice at Dusk">
      </div>
      <div class="field">
        <label for="f-artist">Puzzle Artist</label>
        <input type="text" id="f-artist" placeholder="e.g. Jane Smith" autocomplete="off" list="artist-list">
        <datalist id="artist-list"></datalist>
      </div>
      <div class="field">
        <label for="f-pieces">Piece Count</label>
        <input type="number" id="f-pieces" placeholder="e.g. 1000" min="1" required>
      </div>
      <div class="field">
        <div class="checkbox-row">
          <input type="checkbox" id="f-wooden">
          <label for="f-wooden">Wooden puzzle</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="f-notcompleted">
          <label for="f-notcompleted">Did not complete</label>
        </div>
      </div>
      <div class="field">
        <label>Photo(s)</label>
        <div class="photo-input-wrap">
          <label class="upload-btn">
            📷 Take / choose photo(s)
            <input type="file" id="f-photo" accept="image/*" multiple style="display:none;">
          </label>
        </div>
        <div id="photoPreviewWrap" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;"></div>
      </div>
      <button type="submit" class="submit-btn" id="saveBtn">Save Puzzle</button>
      <div class="status-msg" id="trackStatus"></div>
    </form>
  </div>

  <!-- VIEW: choose grouping -->
  <div class="screen" id="screen-view-options">
    <button class="option-btn" data-group="pieces">By Piece Count</button>
    <button class="option-btn" data-group="brand">By Brand</button>
    <button class="option-btn" id="btnViewByDate">View by Date</button>
    <button class="option-btn" data-group="wooden">View Wooden Puzzles</button>
    <button class="option-btn" data-group="all">View All Tracked Puzzles</button>
  </div>

  <!-- VIEW: choose date grouping -->
  <div class="screen" id="screen-view-date-options">
    <button class="option-btn" data-group="year">View by Year</button>
    <button class="option-btn" data-group="yearmonth">View by Year and Month</button>
  </div>

  <!-- VIEW: category list (e.g. specific piece counts, brands, months) -->
  <div class="screen" id="screen-view-categories">
    <div id="brandSortRow" class="sort-all-row" style="display:none;">
      <button id="sortBrandAlpha" class="active">A–Z</button>
      <button id="sortBrandCountDesc">Most first</button>
      <button id="sortBrandCountAsc">Fewest first</button>
    </div>
    <div id="categoriesContainer"></div>
  </div>

  <!-- VIEW: results -->
  <div class="screen" id="screen-view-results">
    <div class="toggle-row">
      <button id="toggleGrid" class="active">Grid</button>
      <button id="toggleList">List</button>
    </div>
    <div class="toggle-row" id="sortRow" style="display:none;">
      <button id="sortDesc" class="active">Sort Descending</button>
      <button id="sortAsc">Sort Ascending</button>
    </div>
    <div class="sort-all-row" id="allSortRow" style="display:none;">
      <button id="sortAllDateDesc" class="active">Date ↓</button>
      <button id="sortAllDateAsc">Date ↑</button>
      <button id="sortAllPiecesDesc">Pieces ↓</button>
      <button id="sortAllPiecesAsc">Pieces ↑</button>
    </div>
    <div id="resultsCount" class="results-count" style="display:none;"></div>
    <div id="resultsContainer"></div>
  </div>

  <!-- BULK ADD PHOTOS -->
  <div class="screen" id="screen-bulk-photos">
    <div class="field">
      <label>Select photos to add</label>
      <div class="photo-input-wrap">
        <label class="upload-btn">
          🖼️ Choose photos
          <input type="file" id="bulk-photo-input" accept="image/*" multiple style="display:none;">
        </label>
      </div>
    </div>
    <div class="status-msg" id="bulkProgress">Choose photos to begin.</div>
    <img id="bulkPhotoPreview" alt="photo" style="width:100%;border-radius:10px;margin-bottom:14px;display:none;">
    <div class="field" id="bulkSearchField" style="display:none;">
      <label for="bulk-search">Search puzzles by title or brand</label>
      <input type="text" id="bulk-search" placeholder="Start typing...">
    </div>
    <div id="bulkResultsList"></div>
    <button class="modal-close" id="bulkSkip" style="background:var(--brown);display:none;">Skip this photo</button>
  </div>

</main>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div style="position:relative;margin-bottom:14px;">
      <img id="modalImg" alt="" style="margin-bottom:0;">
      <div id="modalNoImg" class="noimg" style="display:none;height:200px;align-items:center;justify-content:center;border-radius:10px;background:var(--tan);">No photo</div>
      <button id="photoPrev" class="photo-nav" style="left:8px;" aria-label="Previous photo">‹</button>
      <button id="photoNext" class="photo-nav" style="right:8px;" aria-label="Next photo">›</button>
      <div id="photoDots" style="text-align:center;padding:6px 0;min-height:18px;"></div>
    </div>
    <div class="detail-row"><span class="label">Date Completed</span><span id="modalDate"></span></div>
    <div class="detail-row"><span class="label">Brand</span><span id="modalBrand"></span></div>
    <div class="detail-row"><span class="label">Title</span><span id="modalTitle"></span></div>
    <div class="detail-row"><span class="label">Artist</span><span id="modalArtist"></span></div>
    <div class="detail-row"><span class="label">Piece Count</span><span id="modalPieces"></span></div>
    <div class="detail-row"><span class="label">Wooden</span><span id="modalWooden"></span></div>
    <div class="detail-row"><span class="label">Completed</span><span id="modalCompleted"></span></div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="modal-close" id="modalEdit" style="background:var(--accent);flex:1;margin:0;">Edit</button>
      <button class="modal-close" id="modalDelete" style="background:#c0392b;flex:1;margin:0;">Delete</button>
    </div>
    <button class="modal-close" id="modalCopyLink" style="margin-top:10px;background:#888;">🔗 Copy Link</button>
    <button class="modal-close" id="modalClose" style="margin-top:10px;">Close</button>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
